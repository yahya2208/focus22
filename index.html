<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FOCUS" />
    <meta name="description" content="FOCUS — Cognitive Measurement Platform | منصة قياس التركيز المعرفي" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/focus-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/focus-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/focus-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>FOCUS — Cognitive Measurement Platform</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        overscroll-behavior: none;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }

      #root {
        min-height: 100dvh;
        min-height: -webkit-fill-available;
      }

      input, select, textarea, button {
        font-family: inherit;
      }

      input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent, #00e4b8);
        outline-offset: 2px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes adspot-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.97; }
      }

      @keyframes adspot-shine {
        0% { background-position: 220% 0; }
        100% { background-position: -120% 0; }
      }

      /* Featured-ad frame height cap — graded by screen size so tall/portrait
         ads never dominate. Mobile keeps the natural size (auto). */
      .adspot-frame {
        max-height: 420px; /* Desktop */
      }
      @media (max-width: 1535px) {
        .adspot-frame { max-height: 360px; } /* Laptop */
      }
      @media (max-width: 1023px) {
        .adspot-frame { max-height: 320px; } /* Tablet */
      }
      @media (max-width: 639px) {
        .adspot-frame { max-height: none; } /* Mobile — auto */
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
