# Minimal config enabling ONLY the function infrastructure required by the
# secure new-auth-account provisioning step. Project id matches the live
# project (fmggysdqigtejxbfpgtg). The service-role credential is NOT defined
# here — it is injected as a deployment/edge-runtime secret, never committed.

