<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1440"/>
      <stop offset="45%" stop-color="#0A0F2E"/>
      <stop offset="100%" stop-color="#070B1F"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#8A5CFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070B1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171E46"/>
      <stop offset="55%" stop-color="#0D1233"/>
      <stop offset="100%" stop-color="#0A0E26"/>
    </linearGradient>
    <linearGradient id="headRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49E3FF"/>
      <stop offset="50%" stop-color="#00CFFF"/>
      <stop offset="100%" stop-color="#FF4DDB"/>
    </linearGradient>
    <radialGradient id="brainBase" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#8A5CFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#070B1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF"/>
      <stop offset="55%" stop-color="#49E3FF"/>
      <stop offset="100%" stop-color="#8A5CFF"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF"/>
      <stop offset="40%" stop-color="#49E3FF"/>
      <stop offset="70%" stop-color="#8A5CFF"/>
      <stop offset="100%" stop-color="#FF4DDB"/>
    </linearGradient>
    <radialGradient id="goldGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FFD54A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6CE"/>
      <stop offset="55%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <linearGradient id="glassStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldBloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#ambient)"/>

  <!-- Glass corner highlight -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glassStreak)"/>

  <!-- HUD Radar arc (open at bottom-left) -->
  <g filter="url(#glowSoft)">
    <path d="M 150.6 480.2 A 310 310 0 1 1 369.8 699.4" fill="none" stroke="url(#arcGrad)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g transform="translate(450 400) scale(0.93) translate(-450 -400)" filter="url(#glowSoft)">
    <path d="M 150.6 480.2 A 310 310 0 1 1 369.8 699.4" fill="none" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- Radar ticks -->
  <g stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85" filter="url(#glowSoft)">
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(0 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(30 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(60 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(90 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(180 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(210 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(240 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(270 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(300 450 400)"/>
    <line x1="450" y1="92" x2="450" y2="64" transform="rotate(330 450 400)"/>
  </g>

  <!-- Head silhouette (side profile facing right) -->
  <path d="M 462 158 C 352 158, 278 236, 278 348 C 278 420, 298 476, 316 544 C 324 574, 336 600, 344 636 L 528 636 C 528 600, 520 566, 512 536 C 504 506, 516 478, 524 452 C 532 428, 522 410, 508 404 C 500 400, 498 392, 502 384 C 507 375, 518 372, 524 362 C 530 352, 528 342, 532 332 C 537 320, 542 306, 540 294 C 538 282, 526 276, 520 268 C 514 260, 514 250, 518 240 C 524 226, 520 210, 514 198 C 508 184, 490 158, 462 158 Z" fill="url(#headGrad)"/>
  <path d="M 462 158 C 352 158, 278 236, 278 348 C 278 420, 298 476, 316 544 C 324 574, 336 600, 344 636 L 528 636 C 528 600, 520 566, 512 536 C 504 506, 516 478, 524 452 C 532 428, 522 410, 508 404 C 500 400, 498 392, 502 384 C 507 375, 518 372, 524 362 C 530 352, 528 342, 532 332 C 537 320, 542 306, 540 294 C 538 282, 526 276, 520 268 C 514 260, 514 250, 518 240 C 524 226, 520 210, 514 198 C 508 184, 490 158, 462 158 Z" fill="none" stroke="#00CFFF" stroke-width="3" opacity="0.25"/>

  <!-- Neon rim light on the face front edge -->
  <g filter="url(#glowSoft)">
    <path d="M 462 158 C 490 158 508 184 514 198 C 520 210 524 226 518 240 C 514 250 514 260 520 268 C 526 276 538 282 540 294 C 542 306 537 320 532 332 C 528 342 530 352 524 362 C 518 372 507 375 502 384 C 498 392 500 400 508 404 C 522 410 532 428 524 452 C 516 478 504 506 512 536 C 520 566 528 600 528 636" fill="none" stroke="url(#headRim)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Brain base (subtle) -->
  <path d="M 342 258 C 372 218, 430 216, 462 244 C 492 268, 500 306, 488 348 C 480 382, 452 410, 414 418 C 382 424, 348 412, 330 384 C 306 352, 300 316, 314 290 C 322 274, 332 264, 342 258 Z" fill="url(#brainBase)"/>

  <!-- Neural network connections -->
  <g stroke="url(#netGrad)" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#glowSoft)" fill="none">
    <line x1="360" y1="275" x2="400" y2="258"/>
    <line x1="400" y1="258" x2="438" y2="272"/>
    <line x1="438" y1="272" x2="470" y2="300"/>
    <line x1="360" y1="275" x2="370" y2="312"/>
    <line x1="400" y1="258" x2="370" y2="312"/>
    <line x1="400" y1="258" x2="408" y2="296"/>
    <line x1="438" y1="272" x2="408" y2="296"/>
    <line x1="438" y1="272" x2="452" y2="322"/>
    <line x1="470" y1="300" x2="452" y2="322"/>
    <line x1="370" y1="312" x2="408" y2="296"/>
    <line x1="408" y1="296" x2="452" y2="322"/>
    <line x1="370" y1="312" x2="332" y2="338"/>
    <line x1="408" y1="296" x2="332" y2="338"/>
    <line x1="408" y1="296" x2="376" y2="352"/>
    <line x1="370" y1="312" x2="376" y2="352"/>
    <line x1="452" y1="322" x2="376" y2="352"/>
    <line x1="452" y1="322" x2="452" y2="358"/>
    <line x1="376" y1="352" x2="416" y2="366"/>
    <line x1="376" y1="352" x2="452" y2="358"/>
    <line x1="332" y1="338" x2="348" y2="398"/>
    <line x1="376" y1="352" x2="348" y2="398"/>
    <line x1="416" y1="366" x2="348" y2="398"/>
    <line x1="416" y1="366" x2="392" y2="404"/>
    <line x1="452" y1="358" x2="392" y2="404"/>
    <line x1="452" y1="358" x2="432" y2="392"/>
    <line x1="392" y1="404" x2="432" y2="392"/>
    <line x1="416" y1="366" x2="432" y2="392"/>
  </g>

  <!-- Golden focus point edges -->
  <g stroke="#FFD54A" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="url(#glowSoft)" fill="none">
    <line x1="408" y1="296" x2="405" y2="330"/>
    <line x1="376" y1="352" x2="405" y2="330"/>
    <line x1="416" y1="366" x2="405" y2="330"/>
    <line x1="452" y1="358" x2="405" y2="330"/>
    <line x1="438" y1="272" x2="405" y2="330"/>
  </g>

  <!-- Neural network nodes -->
  <g filter="url(#glowSoft)">
    <circle cx="360" cy="275" r="9" fill="#00CFFF"/>
    <circle cx="400" cy="258" r="10" fill="#49E3FF"/>
    <circle cx="438" cy="272" r="9" fill="#00CFFF"/>
    <circle cx="470" cy="300" r="8" fill="#8A5CFF"/>
    <circle cx="370" cy="312" r="8" fill="#FF4DDB"/>
    <circle cx="408" cy="296" r="9" fill="#49E3FF"/>
    <circle cx="452" cy="322" r="8" fill="#00CFFF"/>
    <circle cx="332" cy="338" r="7" fill="#8A5CFF"/>
    <circle cx="376" cy="352" r="8" fill="#49E3FF"/>
    <circle cx="416" cy="366" r="7" fill="#FF4DDB"/>
    <circle cx="452" cy="358" r="8" fill="#00CFFF"/>
    <circle cx="348" cy="398" r="6" fill="#8A5CFF"/>
    <circle cx="392" cy="404" r="7" fill="#00CFFF"/>
    <circle cx="432" cy="392" r="6" fill="#FF4DDB"/>
  </g>

  <!-- Golden Moment of Focus -->
  <g filter="url(#goldBloom)">
    <circle cx="405" cy="330" r="66" fill="url(#goldGlowGrad)"/>
  </g>
  <circle cx="405" cy="330" r="13" fill="url(#goldCore)" filter="url(#glowStrong)"/>
  <circle cx="405" cy="330" r="5" fill="#FFF6CE"/>

  <!-- Forehead glass reflection -->
  <g filter="url(#glowSoft)">
    <path d="M 478 224 C 498 248 506 276 500 302" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.22"/>
  </g>

  <!-- Neck neural energy lines -->
  <g fill="none" stroke-width="4" stroke-linecap="round" opacity="0.35" filter="url(#glowSoft)">
    <path d="M 392 470 C 390 520 394 570 398 622" stroke="#00CFFF"/>
    <path d="M 428 470 C 428 522 430 572 432 622" stroke="#49E3FF"/>
    <path d="M 466 474 C 468 524 470 572 472 622" stroke="#8A5CFF"/>
  </g>
</svg>
